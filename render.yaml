services:
  - type: web
    name: cynbit-backend-engine
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://cynbit.in,https://www.cynbit.in
      - key: JWT_SECRET
        generateValue: true
